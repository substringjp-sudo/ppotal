name: Deploy Hosting (Main)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Apps
        run: pnpm build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning title=Firebase Deploy Skipped::FIREBASE_TOKEN secret is not set in GitHub repository settings. To enable auto-deployment, add FIREBASE_TOKEN to Repository Secrets."
            echo "Skipping Firebase deployment step."
            exit 0
          fi

          echo "🚀 Deploying hosting targets to Firebase..."
          firebase deploy --only hosting --token "$FIREBASE_TOKEN"
