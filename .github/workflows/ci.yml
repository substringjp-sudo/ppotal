name: CI & PR Preview Deploy

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-preview:
    name: Build & Deploy PR Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 앱(jpApp)과 나눠 쓰는 데이터·규칙이 어긋났는지 본다. 여기서 걸러야
      # 앱과 웹이 같은 기록에서 다른 경로를 내는 일이 배포까지 가지 않는다.
      - name: Verify jprail data & logic
        run: pnpm --filter japanrailnote run verify:all

      - name: Build & Typecheck All Apps & Packages
        run: pnpm build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting Preview Channel
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning title=Preview Deploy Skipped::FIREBASE_TOKEN secret is missing in GitHub repository settings. Skipping preview deploy."
            exit 0
          fi

          echo "🚀 Deploying PR Preview Channel (pr-${{ github.event.pull_request.number }})..."
          firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --token "$FIREBASE_TOKEN"
